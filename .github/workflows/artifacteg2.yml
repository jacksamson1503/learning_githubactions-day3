name: Artifact Eg2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create a file
        run: |
          echo "Application Build Successful" > app.zip

      - name: Upload file to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-package

      - name: Display output
        run: |
          cat app.zip
